[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "kubeconform-precommit"
version = "0.1.0"
description = "Pre-commit hooks for validating Kubernetes manifests with kubeconform."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-APACHE", "LICENSE-MIT"]

[project.urls]
Repository = "https://github.com/neteye-platform/kubeconform-precommit"
Issues = "https://github.com/neteye-platform/kubeconform-precommit/issues"

[project.scripts]
kubeconform-precommit = "hooks.kubeconform_precommit:main"

[dependency-groups]
dev = [
    "hatchling>=1.27.0",
    "pre-commit>=4.0,<5",
    "pytest>=7.4,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["hooks"]
