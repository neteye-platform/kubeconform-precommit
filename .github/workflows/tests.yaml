name: Tests

on:
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=pypi depName=uv
  UV_VERSION: "0.13.0"
  # Minimum compatible pre-commit version; intentionally not Renovate-managed.
  MIN_PRE_COMMIT_VERSION: "3.0.0"
  # renovate: datasource=pypi depName=pre-commit
  PRE_COMMIT_VERSION: "4.6.2"
  # Minimum compatible prek version; intentionally not Renovate-managed.
  MIN_PREK_VERSION: "0.3.6"
  # renovate: datasource=pypi depName=prek
  PREK_VERSION: "0.5.5"

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Smoke-test minimum supported pre-commit version
        run: ./testdata/smoke-test.sh uvx --from "pre-commit==${MIN_PRE_COMMIT_VERSION}" pre-commit

      - name: Smoke-test hook with pre-commit
        run: ./testdata/smoke-test.sh uvx --from "pre-commit==${PRE_COMMIT_VERSION}" pre-commit

      - name: Smoke-test minimum supported prek version
        run: ./testdata/smoke-test.sh uvx --from "prek==${MIN_PREK_VERSION}" prek

      - name: Smoke-test hook with prek
        run: ./testdata/smoke-test.sh uvx --from "prek==${PREK_VERSION}" prek
