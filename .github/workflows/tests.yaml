name: Tests

on:
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=pypi depName=uv
  UV_VERSION: "0.12.19"
  # renovate: datasource=pypi depName=pre-commit
  PRE_COMMIT_VERSION: "4.6.2"
  # renovate: datasource=pypi depName=prek
  PREK_VERSION: "0.5.3"

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Smoke-test hook with pre-commit
        run: ./testdata/smoke-test.sh uvx --from "pre-commit==${PRE_COMMIT_VERSION}" pre-commit

      - name: Smoke-test hook with prek
        run: ./testdata/smoke-test.sh uvx --from "prek==${PREK_VERSION}" prek
